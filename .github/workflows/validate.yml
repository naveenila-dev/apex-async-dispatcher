name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prettier:verify
      - run: npm install --global @salesforce/cli
      - run: sf project convert source --root-dir force-app --output-dir /tmp/aad-core --api-version 64.0
      - run: sf project convert source --root-dir examples --output-dir /tmp/aad-examples --api-version 64.0
  apex:
    needs: source
    # Only trusted branch pushes/manual runs can use Dev Hub credentials.
    if: vars.AAD_RUN_APEX_TESTS == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        env:
          SF_AUTH_URL: ${{ secrets.SF_DEV_HUB_AUTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          auth_file=$(mktemp)
          trap 'rm -f "$auth_file"' EXIT
          chmod 600 "$auth_file"
          printf '%s' "$SF_AUTH_URL" > "$auth_file"
          sf org login sfdx-url --sfdx-url-file "$auth_file" --alias aad-hub
      - name: Create clean scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --target-dev-hub aad-hub --alias aad-ci --duration-days 1 --wait 20
      - name: Deploy and test core independently
        run: sf project deploy start --source-dir force-app --target-org aad-ci --api-version 64.0 --test-level RunLocalTests --wait 30
      - name: Deploy examples and run all tests
        run: sf project deploy start --source-dir examples --target-org aad-ci --api-version 64.0 --test-level RunLocalTests --wait 30
      - name: Collect test results and coverage
        run: sf apex run test --target-org aad-ci --test-level RunLocalTests --code-coverage --result-format junit --output-dir test-results --wait 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-test-results
          path: test-results
          if-no-files-found: ignore
      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org aad-ci --no-prompt
